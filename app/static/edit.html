<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Student — AI Career Guidance</title>
<link rel="stylesheet" href="/static/style.css">
<script>
  (function () {
    var t = localStorage.getItem("theme") || "system";
    var d = (t === "light") ? "light" : (t === "dark") ? "dark" : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = d;
  })();
</script>
</head>
<body>
<nav id="nav"></nav>

<div class="container">
  <div class="page-head">
    <h1>✏️ Edit Student Profile</h1>
    <p>Update the student's details below. Recommendations will be refreshed automatically.</p>
  </div>

  <div id="loading" class="empty">Loading student data...</div>

  <form id="editForm" class="grid-form" style="display:none" onsubmit="return false;">
    <div class="card">
      <h2>👤 Basic Details</h2>

      <label class="field">Full Name</label>
      <input type="text" id="name" placeholder="e.g. Uday Narayan Singh">

      <label class="field">Email</label>
      <input type="email" id="email" placeholder="student@college.edu">

      <label class="field">Academic Score</label>
      <div class="slider-row">
        <input type="range" id="academic_score" min="0" max="100" value="80">
        <output>80</output>
      </div>

      <label class="field">Interests</label>
      <div class="chips" id="interests-chips"></div>

      <label class="field">Personality Traits</label>
      <div class="chips" id="personality-chips"></div>
    </div>

    <div class="card">
      <h2>📊 Skills &amp; Aptitudes</h2>

      <label class="field">Programming</label>
      <div class="slider-row"><input type="range" id="programming" min="0" max="100" value="75"><output>75</output></div>

      <label class="field">Databases</label>
      <div class="slider-row"><input type="range" id="databases" min="0" max="100" value="70"><output>70</output></div>

      <label class="field">Problem Solving</label>
      <div class="slider-row"><input type="range" id="problem_solving" min="0" max="100" value="80"><output>80</output></div>

      <label class="field">Communication</label>
      <div class="slider-row"><input type="range" id="communication" min="0" max="100" value="70"><output>70</output></div>

      <label class="field">Creativity</label>
      <div class="slider-row"><input type="range" id="creativity" min="0" max="100" value="65"><output>65</output></div>

      <label class="field">Teamwork</label>
      <div class="slider-row"><input type="range" id="teamwork" min="0" max="100" value="70"><output>70</output></div>

      <label class="field">Analytical</label>
      <div class="slider-row"><input type="range" id="analytical" min="0" max="100" value="75"><output>75</output></div>

      <div style="display:flex;gap:10px;margin-top:22px">
        <button class="ghost" id="cancel" type="button" style="flex:1">Cancel</button>
        <button class="primary" id="save" type="button" style="flex:3;margin-top:0">💾 Save Changes</button>
      </div>
    </div>
  </form>
</div>

<footer>AI-Based Student Career Guidance System • Team Hunters Algorithm • IMS Noida (2024–2027)</footer>

<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
<script>
  buildNav("/students");
  buildChips("interests-chips", INTERESTS);
  buildChips("personality-chips", PERSONALITY);

  SKILLS.forEach((id) => {
    const el = document.getElementById(id);
    el.addEventListener("input", () => (el.nextElementSibling.textContent = el.value));
  });

  document.getElementById("cancel").addEventListener("click", () => {
    window.location.href = "/students";
  });

  const params = new URLSearchParams(window.location.search);
  const sid = params.get("id");
  if (!sid) {
    document.getElementById("loading").innerHTML = '<div class="empty">No student selected. <a style="color:var(--accent)" href="/students">Go back</a>.</div>';
  } else {
    loadStudent(sid);
  }

  async function loadStudent(id) {
    try {
      const st = await api(`/api/students/${id}`);
      document.getElementById("name").value = st.name;
      document.getElementById("email").value = st.email;
      SKILLS.forEach((s) => {
        document.getElementById(s).value = st[s];
        document.getElementById(s).nextElementSibling.textContent = st[s];
      });
      (st.interests || []).forEach((i) => {
        const cb = document.querySelector(`#interests-chips input[value="${i}"]`);
        if (cb) cb.checked = true;
      });
      Object.keys(st.personality || {}).forEach((p) => {
        const cb = document.querySelector(`#personality-chips input[value="${p}"]`);
        if (cb) cb.checked = true;
      });
      document.getElementById("loading").style.display = "none";
      document.getElementById("editForm").style.display = "grid";
    } catch (e) {
      document.getElementById("loading").innerHTML = `<div class="empty">${e.message}</div>`;
      showToast(e.message, false);
    }
  }

  document.getElementById("save").addEventListener("click", async () => {
    const btn = document.getElementById("save");
    const payload = {
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      interests: [...document.querySelectorAll("#interests-chips input:checked")].map((i) => i.value),
      personality: {},
    };
    document.querySelectorAll("#personality-chips input:checked").forEach(
      (i) => (payload.personality[i.value] = "true")
    );
    SKILLS.forEach((id) => (payload[id] = Number(document.getElementById(id).value)));

    if (!payload.name || !payload.email) return showToast("Name and email are required", false);

    btn.disabled = true;
    btn.textContent = "Saving...";
    try {
      const updated = await api(`/api/students/${sid}`, "PUT", payload);
      await api(`/api/students/${sid}/recommendations`, "POST");
      showToast(`Saved! Top match: ${updated.name}`);
      setTimeout(() => (window.location.href = `/recommendations?id=${sid}`), 900);
    } catch (e) {
      showToast(e.message, false);
      btn.disabled = false;
      btn.textContent = "💾 Save Changes";
    }
  });
</script>
</body>
</html>
