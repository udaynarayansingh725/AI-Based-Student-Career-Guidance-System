version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: career_guidance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career_pass
      POSTGRES_DB: career_guidance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: career_guidance_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://career:career_pass@db:5432/career_guidance
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata: